<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo - Mi Biblioteca</title>
  <style>
    :root {
      /* Proporción por defecto (Ancho / Alto) */
      --aspect-ratio: 0.75; 
    }

    body {
      background-color: #0d0f12;
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 20px;
    }

    .header-bar {
      display: flex;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
      margin-bottom: 25px;
    }

    .btn-back {
      background-color: #1a2230;
      color: #64b5f6;
      border: 1px solid #2c3b54;
      padding: 8px 16px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 14px;
      transition: background-color 0.2s;
    }

    .btn-back:hover {
      background-color: #243044;
    }

    .console-title {
      font-size: 24px;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0;
    }

    .search-container {
      margin-bottom: 20px;
      width: 100%;
      max-width: 350px;
    }

    .search-input {
      width: 100%;
      padding: 10px 14px;
      border-radius: 6px;
      border: 1px solid #2a2f3a;
      background-color: #161a22;
      color: #ffffff;
      font-size: 14px;
      box-sizing: border-box;
      outline: none;
    }

    .search-input:focus {
      border-color: #4a90e2;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 20px;
    }

    .game-card {
      background-color: #161a22;
      border: 1px solid #2a2f3a;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s;
    }

    .game-card:hover {
      transform: translateY(-4px);
    }

    /* Contenedor adaptativo según la proporción de la caja */
    .cover-container {
      width: 100%;
      aspect-ratio: var(--aspect-ratio);
      overflow: hidden;
      background-color: #000;
    }

    .cover-container img {
      width: 100%;
      height: 100%;
      object-fit: contain; /* Garantiza que la carátula no se deforme ni se recorte */
    }

    .game-title {
      padding: 10px;
      font-size: 13px;
      text-align: center;
      background-color: #161a22;
      color: #e0e0e0;
      margin: 0;
    }
  </style>
</head>
<body>

  <div class="header-bar">
    <a href="index.html" class="btn-back">← Consolas</a>
    <h1 class="console-title" id="consoleTitle">🎮 Cargando...</h1>
  </div>

  <div class="search-container">
    <input 
      type="text" 
      id="searchInput" 
      class="search-input" 
      placeholder="Buscar juego..." 
      onkeyup="filterGames()"
    >
  </div>

  <div class="grid-container" id="gamesGrid">
    <!-- Los juegos se cargan dinámicamente -->
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const consoleKey = urlParams.get('console') || 'snes';

    // Nombres visibles
    const consoleNames = {
      'snes': 'Super Nintendo',
      'nes': 'NES',
      'megadrive': 'Sega Mega Drive',
      'gb': 'Game Boy',
      'gba': 'Game Boy Advance',
      'n64': 'Nintendo 64',
      'psx': 'PlayStation'
    };

    // Proporciones según las cajas originales (Ancho / Alto)
    const aspectRatios = {
      'snes': '1.37 / 1',    // Horizontal (USA/PAL)
      'nes': '0.72 / 1',     // Vertical
      'megadrive': '0.71 / 1',// Vertical
      'gb': '1 / 1',         // Cuadrada
      'gba': '1 / 1',        // Cuadrada
      'n64': '1.37 / 1',    // Horizontal
      'psx': '1 / 1'         // Cuadrada (Caja CD)
    };

    // Aplicar la proporción dinámica si existe
    if (aspectRatios[consoleKey]) {
      document.documentElement.style.setProperty('--aspect-ratio', aspectRatios[consoleKey]);
    }

    document.getElementById('consoleTitle').textContent = `🎮 ${consoleNames[consoleKey] || consoleKey.toUpperCase()}`;

    // Carga de datos
    fetch(`${consoleKey}.json`)
      .then(response => response.json())
      .then(games => {
        const container = document.getElementById('gamesGrid');
        container.innerHTML = '';

        games.forEach(game => {
          const card = document.createElement('div');
          card.className = 'game-card';
          card.innerHTML = `
            <a href="player.html?game=${encodeURIComponent(game.file)}&console=${consoleKey}" style="text-decoration: none; color: inherit;">
              <div class="cover-container">
                <img src="${game.cover}" alt="${game.title}" loading="lazy">
              </div>
              <p class="game-title">${game.title}</p>
            </a>
          `;
          container.appendChild(card);
        });
      })
      .catch(err => {
        console.error('Error al cargar la lista de juegos:', err);
      });

    // Buscador
    function filterGames() {
      const filter = document.getElementById('searchInput').value.toLowerCase();
      const cards = document.querySelectorAll('.game-card');

      cards.forEach(card => {
        const title = card.querySelector('.game-title').textContent.toLowerCase();
        if (title.includes(filter)) {
          card.style.display = "";
        } else {
          card.style.display = "none";
        }
      });
    }
  </script>
</body>
</html>
