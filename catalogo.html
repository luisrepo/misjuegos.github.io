<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo — Mi Biblioteca Retro</title>
    <style>
        /* Estética Base Github Dark / Retro */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            margin: 0;
            padding: 20px;
        }

        .header-retro {
            display: flex;
            align-items: center;
            justify-content: space-between; /* Espaciado adaptado para el buscador */
            border-bottom: 1px solid #21262d;
            padding-bottom: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .header-left {
            display: flex;
            align-items: center;
        }

        .btn-volver {
            background-color: #21262d;
            color: #58a6ff;
            border: 1px solid #30363d;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
            margin-right: 20px;
            transition: 0.2s;
        }

        .btn-volver:hover {
            background-color: #30363d;
            border-color: #8b949e;
        }

        h1 {
            font-size: 24px;
            margin: 0;
            color: #f0f6fc;
        }

        /* Estilos de la Barra de Búsqueda Integrada */
        .search-container {
            position: relative;
        }

        .search-input {
            background-color: #0d1117;
            color: #c9d1d9;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 8px 12px;
            font-size: 14px;
            width: 240px;
            transition: all 0.2s ease;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--console-color, #58a6ff);
            width: 300px;
            box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.15);
        }

        /* Contenedor Grid Universal */
        .grid-juegos {
            display: grid;
            gap: 24px;
            padding: 10px;
        }

        /* Tarjeta Multimedia Base */
        .juego-card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .juego-card:hover {
            transform: translateY(-5px);
            border-color: var(--console-color, #58a6ff);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
        }

        .media-container {
            width: 100%;
            position: relative;
            background-color: #0d1117; /* Fondo a juego con el body */
            overflow: hidden;
        }

        /* 🌟 CORRECCIÓN DE PORTADAS COMPLETAS (Ajuste contain para evitar recortes) */
        .media-container img, 
        .media-container video {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Cambiado de 'cover' a 'contain' para mostrar la carátula al completo */
            position: absolute;
            top: 0;
            left: 0;
            transition: opacity 0.3s ease;
        }

        .media-container video {
            opacity: 0;
            pointer-events: none;
        }

        .juego-card:hover .media-container video { opacity: 1; }
        .juego-card:hover .media-container img { opacity: 0; }

        .juego-titulo {
            padding: 12px;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
            color: #f0f6fc;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            background-color: #161b22;
            border-top: 1px solid #30363d;
        }

        .loading {
            grid-column: 1 / -1;
            text-align: center;
            font-size: 16px;
            color: #8b949e;
            padding: 50px;
        }

        /* ==========================================================================
           MODIFICADORES DE ASPECTO POR CONSOLA (DISEÑO DE LAS CARÁTULAS)
           ========================================================================== */

        /* Ajustes específicos para que las portadas americanas horizontales de SNES se vean amplias */
        .grid-snes {
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        }
        .grid-snes .media-container {
            height: 165px; /* Proporción ideal horizontal para SNES sin deformar */
        }

        /* Cajas verticales para sistemas de cartucho o CD tradicionales */
        .grid-megadrive, .grid-mastersystem {
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
        }
        .grid-megadrive .media-container, .grid-mastersystem .media-container {
            height: 240px; 
        }

        /* Estilo enfocado a portátiles cuadradas */
        .grid-gba {
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        }
        .grid-gba .media-container {
            height: 180px;
        }
    </style>
</head>
<body>

    <div class="header-retro">
        <div class="header-left">
            <a href="index.html" class="btn-volver">← Consolas</a>
            <h1 id="console-title">Cargando consola...</h1>
        </div>
        
        <!-- Barra de búsqueda agregada dinámicamente -->
        <div class="search-container">
            <input type="text" id="search-box" class="search-input" placeholder="Buscar juego en esta consola..." autocomplete="off">
        </div>
    </div>

    <div class="grid-juegos" id="contenedor-juegos">
        <div class="loading">Buscando configuración del sistema...</div>
    </div>

    <script>
        let todosLosJuegos = []; // Variable global para almacenar el listado completo y poder filtrar

        async function loadConsoleConfig() {
            const grid = document.getElementById("contenedor-juegos");
            const mainTitle = document.getElementById("console-title");
            const searchBox = document.getElementById("search-box");

            const params = new URLSearchParams(window.location.search);
            const consoleFolder = params.get('console');

            if (!consoleFolder) {
                grid.innerHTML = `<div class="loading" style="color: #ff7b72;">Error: No se especificó consola.</div>`;
                return;
            }

            const jsonPath = `media/${consoleFolder}/config.json`;

            try {
                const response = await fetch(jsonPath);
                if (!response.ok) throw new Error(`No se encontró el archivo config.json`);
                
                const consoleData = await response.json();

                // Asignación de la clase adaptada al formato de dimensiones
                grid.className = `grid-juegos grid-${consoleFolder}`;

                document.documentElement.style.setProperty('--console-color', consoleData.color || '#58a6ff');
                mainTitle.innerHTML = `🎮 ${consoleData.title}`;
                
                if (!consoleData.games || consoleData.games.length === 0) {
                    grid.innerHTML = `<div class="loading">No hay juegos listados.</div>`;
                    return;
                }

                // Guardar la lista para el buscador de texto
                todosLosJuegos = consoleData.games;

                // Renderizado inicial completo
                renderCards(todosLosJuegos, consoleFolder, consoleData.core);

                // Configurar el evento del cuadro de búsqueda en tiempo real
                searchBox.oninput = (e) => {
                    const textoBusqueda = e.target.value.toLowerCase().trim();
                    const juegosFiltrados = todosLosJuegos.filter(juego => 
                        juego.title.toLowerCase().includes(textoBusqueda)
                    );
                    renderCards(juegosFiltrados, consoleFolder, consoleData.core);
                };

            } catch (error) {
                console.error(error);
                grid.innerHTML = `<div class="loading" style="color: #ff7b72;">Error al cargar la base de datos.</div>`;
            }
        }

        // Función modular para renderizar las tarjetas físicas en el DOM
        function renderCards(listaJuegos, folder, core) {
            const grid = document.getElementById("contenedor-juegos");
            grid.innerHTML = "";

            if (listaJuegos.length === 0) {
                grid.innerHTML = `<div class="loading">No se encontraron juegos que coincidan.</div>`;
                return;
            }

            listaJuegos.forEach(juego => {
                const coverUrl = `media/${folder}/covers/${juego.cover}`;
                const videoUrl = `media/${folder}/videos/${juego.video}`;

                const card = document.createElement("div");
                card.className = "juego-card";
                
                card.innerHTML = `
                    <div class="media-container">
                        <img src="${coverUrl}" alt="${juego.title}" onerror="this.src='https://placehold.co'">
                        ${juego.video ? `<video src="${videoUrl}" loop muted playsinline></video>` : ''}
                    </div>
                    <div class="juego-titulo">${juego.title}</div>
                `;

                if (juego.video) {
                    const videoElement = card.querySelector('video');
