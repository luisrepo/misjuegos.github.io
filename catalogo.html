<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1">

<meta name="theme-color"
      content="#7c3aed">

<title>Catálogo Retro</title>

<link rel="preconnect"
      href="https://fonts.googleapis.com">

<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet">

<style>

:root{

    --accent:#7c3aed;

    --bg:#0b0b0f;

    --surface:#18181c;

    --surface2:#222229;

    --border:#30303a;

    --text:#ffffff;

    --muted:#9ca3af;

    --radius:18px;

}

*{

    margin:0;

    padding:0;

    box-sizing:border-box;

}

html{

    scroll-behavior:smooth;

}

body{

    font-family:"Inter",sans-serif;

    background:var(--bg);

    color:var(--text);

    overflow-x:hidden;

}

img{

    display:block;

    width:100%;

    height:100%;

    object-fit:cover;

    user-select:none;

    -webkit-user-drag:none;

}

video{

    display:block;

    width:100%;

    height:100%;

    object-fit:cover;

}

a{

    color:inherit;

    text-decoration:none;

}

button,input{

    font-family:inherit;

}

/* ===================================== */

#topbar{

    position:sticky;

    top:0;

    z-index:999;

    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:20px;

    padding:18px 28px;

    backdrop-filter:blur(18px);

    background:rgba(10,10,12,.85);

    border-bottom:1px solid var(--border);

}

.logo{
    display:flex;
    align-items:center;
    gap:12px;
    font-size:28px;
    font-weight:800;
}

#systemLogo{
    width:42px;
    height:42px;
    object-fit:contain;
    flex-shrink:0;
}

#systemTitle{
    display:flex;
    align-items:center;
}

#systemIcon{

    font-size:34px;

}

.searchBox{

    width:420px;

    max-width:100%;

}

#search{

    width:100%;

    padding:14px 18px;

    border-radius:14px;

    border:1px solid var(--border);

    background:#141418;

    color:white;

    outline:none;

    transition:.25s;

}

#search:focus{

    border-color:var(--accent);

    box-shadow:0 0 0 4px rgba(124,58,237,.15);

}

/* ===================================== */

main{

    max-width:1800px;

    margin:auto;

    padding:28px;

}

.games{

    display:grid;

    grid-template-columns:repeat(auto-fill,minmax(240px,1fr));

    gap:24px;

}

/* ===================================== */

.card{

    position:relative;

    width: var(--card-width);
    min-height: var(--card-height);

    background:var(--surface);

    border:1px solid var(--border);

    border-radius:var(--radius);

    overflow:hidden;

    cursor:pointer;

    transition:
        transform .22s,
        border-color .22s,
        box-shadow .22s;

}

.card:hover{

    transform:translateY(-6px);

    border-color:var(--accent);

    box-shadow:

        0 18px 40px rgba(0,0,0,.40);

}

.cover{
    position: relative;
    aspect-ratio: var(--cover-ratio);
    overflow: hidden;
}

.cover img{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    object-fit: var(--cover-fit);

    opacity:1;

    transition:
        opacity .25s,
        transform .25s;
}

.cover video{

    position:absolute;

    inset:0;

    opacity:0;

    transition:opacity .25s;

}

.card:hover img{

    transform:scale(1.04);

}

.shadow{

    position:absolute;

    inset:0;

    background:

        linear-gradient(

            transparent 55%,

            rgba(0,0,0,.65)

        );

    pointer-events:none;

}

.playButton{

    position:absolute;

    left:50%;

    top:50%;

    transform:

        translate(-50%,-50%) scale(.82);

    width:72px;

    height:72px;

    border-radius:50%;

    display:flex;

    justify-content:center;

    align-items:center;

    background:rgba(124,58,237,.95);

    color:white;

    font-size:28px;

    font-weight:bold;

    opacity:0;

    transition:.25s;

}

.card:hover .playButton{

    opacity:1;

    transform:

        translate(-50%,-50%) scale(1);

}

/* ===================================== */

.info{

    padding:16px;

}

.info h3{

    font-size:17px;

    margin-bottom:6px;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

}

.info p{

    color:var(--muted);

    font-size:13px;

}

/* ===================================== */

.empty{

    grid-column:1/-1;

    text-align:center;

    padding:80px;

    color:var(--muted);

    font-size:22px;

}

/* ===================================== */

::-webkit-scrollbar{

    width:10px;

}

::-webkit-scrollbar-thumb{

    background:#444;

    border-radius:20px;

}

::-webkit-scrollbar-thumb:hover{

    background:var(--accent);

}

/* ===================================== */

@media (max-width:900px){

#topbar{

    flex-direction:column;

    align-items:stretch;

}

.searchBox{

    width:100%;

}

main{

    padding:16px;

}

.games{

    grid-template-columns:

        repeat(auto-fill,minmax(170px,1fr));

    gap:16px;

}

.playButton{

    width:56px;

    height:56px;

    font-size:22px;

}

}

#btnInicio{

    padding:10px 18px;

    border:none;

    border-radius:12px;

    background:#7c3aed;

    color:white;

    font-size:15px;

    font-weight:bold;

    cursor:pointer;

    transition:.2s;

}

#btnInicio:hover{

    background:#6d28d9;

    transform:scale(1.05);

}

</style>

</head>

<body>

<header id="topbar">

    <div class="logo">

    <img id="systemLogo" alt="Logo">

        <span id="systemTitle">
            Catálogo Retro
        </span>

    </div>

    <button id="btnInicio" onclick="window.location.href='index.html'">
    🏠 Inicio
</button>

    <div class="searchBox">

        <input
            id="search"
            type="search"
            placeholder="Buscar juego..."
            autocomplete="off">

    </div>

</header>


<main>

    <section
        id="games"
        class="games">

    </section>

</main>


<template id="cardTemplate">

<article class="card">

    <div class="cover">

        <img
            loading="lazy"
            draggable="false"
            alt="">

        <video

            muted
            loop
            playsinline
            preload="none">

        </video>

        <div class="shadow"></div>

        <div class="playButton">

            ▶

        </div>

    </div>

    <div class="info">

        <h3></h3>

        <p></p>

    </div>

</article>

</template>


<script>

"use strict";

const params = new URLSearchParams(window.location.search);
const system = params.get("system") || "snes";
const BASE = `media/${system}`;


/* ==========================================================
   RETRO CATALOG V3
   MOTOR PRINCIPAL
========================================================== */



//----------------------------------------------------------
// RUTAS
//----------------------------------------------------------

const CONFIG_URL = `${BASE}/config.json`;

let ARCHIVE_URL = "";


//----------------------------------------------------------
// ELEMENTOS
//----------------------------------------------------------

const gamesContainer = document.getElementById("games");

const searchInput = document.getElementById("search");

const template = document.getElementById("cardTemplate");

const systemTitle = document.getElementById("systemTitle");

const systemIcon = document.getElementById("systemIcon");


//----------------------------------------------------------
// VARIABLES
//----------------------------------------------------------

let CONFIG = {};

let GAMES = [];

let FILTERED = [];


//----------------------------------------------------------
// CARGAR JSON
//----------------------------------------------------------

async function loadCatalog(){

    try{

        console.log("SYSTEM:", system);
        console.log("BASE:", BASE);
        console.log("CONFIG_URL:", CONFIG_URL);

        const response = await fetch(CONFIG_URL,{
           cache:"no-cache"
});

        if(!response.ok){

            throw new Error(CONFIG_URL);

        }

CONFIG = await response.json();

ARCHIVE_URL = `https://archive.org/download/${CONFIG.archive}/`;

document.documentElement.style.setProperty(
    "--cover-fit",
    CONFIG.coverFit || "cover"
);

document.documentElement.style.setProperty(
    "--cover-ratio",
    CONFIG.coverRatio || "16/9"
);

document.documentElement.style.setProperty(
    "--card-width",
    CONFIG.cardWidth || "240px"
);

document.documentElement.style.setProperty(
    "--card-height",
    CONFIG.cardHeight || "380px"
);

ARCHIVE_URL = `https://archive.org/download/${CONFIG.archive}/`;

document.title = CONFIG.title;

document.getElementById("systemTitle").textContent = CONFIG.title;

const logo = document.getElementById("systemLogo");

if (logo) {
    logo.src = BASE + "/logos/logo.png";
    logo.onerror = () => logo.style.display = "none";
}

GAMES = CONFIG.games || [];

FILTERED = [...GAMES];

initializeCatalog();

    }

    catch(error){

        showError(error);

    }

}


//----------------------------------------------------------
// INICIALIZAR
//----------------------------------------------------------

function initializeCatalog(){

    document.title = CONFIG.title || "Retro Catalog";

    systemTitle.textContent =
        CONFIG.title || SYSTEM.toUpperCase();

    if(CONFIG.icon){

        systemIcon.textContent = CONFIG.icon;

    }

    if(CONFIG.color){

        document.documentElement
            .style
            .setProperty("--accent",CONFIG.color);

    }

    renderCatalog(FILTERED);

}


//----------------------------------------------------------
// UTILIDADES
//----------------------------------------------------------

function coverUrl(game){

    if(game.cover.startsWith("http://") || game.cover.startsWith("https://")){
        return game.cover;
    }

    return ARCHIVE_URL + encodeURIComponent(game.cover);

}

function videoUrl(game){

    if(game.video.startsWith("http://") || game.video.startsWith("https://")){
        return game.video;
    }

    return ARCHIVE_URL + encodeURIComponent(game.video);

}

function romUrl(game){

    if(game.rom.startsWith("http://") || game.rom.startsWith("https://")){
        return game.rom;
    }

    return ARCHIVE_URL + encodeURIComponent(game.rom);

}


//----------------------------------------------------------
// ERROR
//----------------------------------------------------------

function showError(error){

    console.error(error);

    gamesContainer.innerHTML=`

        <div class="empty">

            No se pudo cargar

            <br><br>

            ${CONFIG_URL}

        </div>

    `;

}

/* ==========================================================
   RENDER DEL CATÁLOGO
========================================================== */

function renderCatalog(list){

    gamesContainer.textContent = "";

    if(list.length === 0){

        const empty = document.createElement("div");

        empty.className = "empty";

        empty.textContent = "No se encontraron juegos.";

        gamesContainer.appendChild(empty);

        return;

    }

    const fragment = document.createDocumentFragment();

    list.forEach(game=>{

        fragment.appendChild(createCard(game));

    });

    gamesContainer.appendChild(fragment);

    observeImages();

}


/* ==========================================================
   CREAR TARJETA
========================================================== */

function createCard(game){

    const card =
        template.content.firstElementChild.cloneNode(true);

    card.dataset.title =
        game.title.toLowerCase();

    card.dataset.rom =
        romUrl(game);

    if(game.genre){

        card.dataset.genre =
            game.genre.toLowerCase();

    }

    if(game.publisher){

        card.dataset.publisher =
            game.publisher.toLowerCase();

    }

    const img =
        card.querySelector("img");

    img.dataset.src =
        coverUrl(game);

    img.alt =
        game.title;

    const video =
        card.querySelector("video");

    if(game.video){

        video.dataset.src =
            videoUrl(game);

    }else{

        video.remove();

    }

    card.querySelector("h3").textContent =
        game.title;

    card.querySelector("p").textContent =
        CONFIG.title;

    return card;

}


/* ==========================================================
   ABRIR JUEGO
========================================================== */

gamesContainer.addEventListener("click",e=>{

    const card = e.target.closest(".card");

    if(!card) return;

    const url =
        `play.html?core=${CONFIG.core}&rom=${encodeURIComponent(card.dataset.rom)}`;

    window.location.href = url;

});

/* ==========================================================
   LAZY LOADING DE PORTADAS
========================================================== */

const imageObserver = new IntersectionObserver((entries)=>{

    entries.forEach(entry=>{

        if(!entry.isIntersecting) return;

        const img = entry.target;

        img.src = img.dataset.src;

        img.removeAttribute("data-src");

        imageObserver.unobserve(img);

    });

},{
    rootMargin:"300px"
});


function observeImages(){

    gamesContainer
        .querySelectorAll("img[data-src]")
        .forEach(img=>imageObserver.observe(img));

}


/* ==========================================================
   PREVIEW DE VÍDEOS
========================================================== */

let hoverTimer = null;

let activeVideo = null;


gamesContainer.addEventListener(
    "pointerenter",
    handlePointerEnter,
    true
);

gamesContainer.addEventListener(
    "pointerleave",
    handlePointerLeave,
    true
);


function handlePointerEnter(e){

    const card = e.target.closest(".card");

    if(!card) return;

    const video = card.querySelector("video");

    if(!video) return;

    clearTimeout(hoverTimer);

    hoverTimer = setTimeout(()=>{

        if(activeVideo && activeVideo!==video){

            stopVideo(activeVideo);

        }

        if(!video.src){

            video.src = video.dataset.src;

        }

        activeVideo = video;

        video.play().catch(()=>{});

        const img = card.querySelector("img");

        img.style.opacity = "0";

        video.style.opacity = "1";

    },150);

}


function handlePointerLeave(e){

    clearTimeout(hoverTimer);

    const card = e.target.closest(".card");

    if(!card) return;

    const video = card.querySelector("video");

    if(!video) return;

    stopVideo(video);

}


/* ==========================================================
   DETENER VÍDEO
========================================================== */

function stopVideo(video){

    video.pause();

    video.currentTime = 0;

    video.style.opacity = "0";

    const img = video.parentElement.querySelector("img");

    if(img){

        img.style.opacity = "1";

    }

}


/* ==========================================================
   LIBERAR MEMORIA
========================================================== */

const videoObserver = new IntersectionObserver((entries)=>{

    entries.forEach(entry=>{

        if(entry.isIntersecting) return;

        const video = entry.target;

        stopVideo(video);

        video.removeAttribute("src");

        video.load();

    });

},{
    rootMargin:"100px"
});


function observeVideos(){

    gamesContainer
        .querySelectorAll("video")
        .forEach(video=>videoObserver.observe(video));

}

/* ==========================================================
   BUSCADOR V3
========================================================== */

searchInput.addEventListener("input", searchGames);

function searchGames(){

    const text = searchInput.value
        .trim()
        .toLowerCase();

    let visible = 0;

    gamesContainer
        .querySelectorAll(".card")
        .forEach(card=>{

            const title = card.dataset.title;

            const genre = card.dataset.genre || "";

            const publisher = card.dataset.publisher || "";

            const match =

                title.includes(text) ||

                genre.includes(text) ||

                publisher.includes(text);

            card.hidden = !match;

            if(match) visible++;

        });

    updateEmptyState(visible);

}


/* ==========================================================
   MENSAJE VACÍO
========================================================== */

function updateEmptyState(total){

    let empty =
        document.getElementById("emptyState");

    if(total>0){

        if(empty){

            empty.remove();

        }

        return;

    }

    if(empty) return;

    empty = document.createElement("div");

    empty.id = "emptyState";

    empty.className = "empty";

    empty.textContent = "No se encontraron juegos.";

    gamesContainer.appendChild(empty);

}


/* ==========================================================
   ORDENAR
========================================================== */

function sortGames(mode="az"){

    const cards =
        [...gamesContainer.querySelectorAll(".card")];

    cards.sort((a,b)=>{

        switch(mode){

            case "za":

                return b.dataset.title.localeCompare(a.dataset.title);

            default:

                return a.dataset.title.localeCompare(b.dataset.title);

        }

    });

    cards.forEach(card=>{

        gamesContainer.appendChild(card);

    });

}


/* ==========================================================
   ATAJOS
========================================================== */

document.addEventListener("keydown",e=>{

    if(e.key==="/"){

        e.preventDefault();

        searchInput.focus();

    }

    if(e.key==="Escape"){

        searchInput.value="";

        searchGames();

        searchInput.blur();

    }

});


/* ==========================================================
   IMAGEN POR DEFECTO
========================================================== */

gamesContainer.addEventListener("error",e=>{

    if(e.target.tagName==="IMG"){

        e.target.src="media/default-cover.jpg";

    }

},true);


/* ==========================================================
   INICIO
========================================================== */

window.addEventListener("DOMContentLoaded",()=>{

    loadCatalog();

});

/* ==========================================================
   VISTA PREVIA INTELIGENTE (SMART PREVIEW)
========================================================== */

let previewTimer = null;
let currentCard = null;

function startPreview(card){

    if(card===currentCard) return;

    stopPreview();

    currentCard = card;

    const video = card.querySelector("video");

    if(!video) return;

    previewTimer = setTimeout(()=>{

        if(!video.src){

            video.src = video.dataset.src;

            video.load();

        }

        video.play().catch(()=>{});

        const img = card.querySelector("img");

        if(img){

            img.style.opacity="0";

        }

        video.style.opacity="1";

    },150);

}

function stopPreview(){

    clearTimeout(previewTimer);

    if(!currentCard) return;

    const video = currentCard.querySelector("video");

    if(video){

        video.pause();

        video.currentTime = 0;

        video.style.opacity = "0";

    }

    const img = currentCard.querySelector("img");

    if(img){

        img.style.opacity = "1";

    }

    currentCard = null;

}


/* ==========================================================
   EVENTOS DEL RATÓN
========================================================== */

gamesContainer.addEventListener("pointerover",(e)=>{

    const card = e.target.closest(".card");

    if(!card) return;

    startPreview(card);

});

gamesContainer.addEventListener("pointerout",(e)=>{

    const card = e.target.closest(".card");

    if(!card) return;

    stopPreview();

});


/* ==========================================================
   DOBLE TOQUE EN MÓVIL
========================================================== */

let lastTouchCard = null;

gamesContainer.addEventListener("touchend",(e)=>{

    const card = e.target.closest(".card");

    if(!card) return;

    if(lastTouchCard===card){

        window.location.href =
          `play.html?system=${system}&core=${CONFIG.core}&rom=${encodeURIComponent(card.dataset.rom)}`;
        lastTouchCard = null;

        return;

    }

    lastTouchCard = card;

    startPreview(card);

    setTimeout(()=>{

        lastTouchCard = null;

    },1000);

},{passive:true});


/* ==========================================================
   LIBERAR MEMORIA DE LOS VÍDEOS
========================================================== */

const previewObserver = new IntersectionObserver(entries=>{

    entries.forEach(entry=>{

        if(entry.isIntersecting) return;

        const video = entry.target;

        video.pause();

        video.removeAttribute("src");

        video.load();

    });

},{
    rootMargin:"200px"
});

document.addEventListener("DOMContentLoaded",()=>{

    gamesContainer.querySelectorAll("video").forEach(video=>{

        previewObserver.observe(video);

    });

});

/* ==========================================================
   RETRO CATALOG V3
   PARTE 8
   EMULATORJS + UTILIDADES
========================================================== */

/* ---------- Abrir juego ---------- */

function openGame(rom){

    stopPreview();
	console.log("SYSTEM EN CATALOGO =", system);

    const url =
        `play.html?system=${system}&core=${CONFIG.core}&rom=${encodeURIComponent(rom)}`;

    window.location.assign(url);

}

/* ---------- Click ---------- */

gamesContainer.addEventListener("click",(e)=>{

    const card = e.target.closest(".card");

    if(!card) return;

    openGame(card.dataset.rom);

});


/* ---------- Precargar EmulatorJS ---------- */

const emulatorPreload = document.createElement("link");

emulatorPreload.rel = "prefetch";

emulatorPreload.href = "play.html";

document.head.appendChild(emulatorPreload);


/* ---------- Detener vídeos al cambiar de pestaña ---------- */

document.addEventListener("visibilitychange",()=>{

    if(document.hidden){

        stopPreview();

    }

});


/* ---------- Detener vídeos al salir ---------- */

window.addEventListener("pagehide",()=>{

    stopPreview();

});


/* ---------- Evitar arrastrar imágenes ---------- */

document.addEventListener("dragstart",(e)=>{

    if(e.target.matches("img,video")){

        e.preventDefault();

    }

});


/* ---------- Información ---------- */

console.log(`
===================================

 Retro Catalog V3

 Sistema : ${SYSTEM}

 Core : ${CONFIG.core}

 Juegos : ${GAMES.length}

===================================
`);

/* ==========================================================
   RETRO CATALOG V3
   PARTE 9
   EFECTOS Y RENDIMIENTO
========================================================== */

/* ---------- Efecto Spotlight ---------- */

gamesContainer.addEventListener("pointermove",(e)=>{

    const card = e.target.closest(".card");

    if(!card) return;

    const rect = card.getBoundingClientRect();

    const x = e.clientX - rect.left;

    const y = e.clientY - rect.top;

    card.style.setProperty("--mx",x+"px");

    card.style.setProperty("--my",y+"px");

});


/* ---------- Precargar imágenes cercanas ---------- */

const preloadObserver = new IntersectionObserver(entries=>{

    entries.forEach(entry=>{

        if(!entry.isIntersecting) return;

        const card = entry.target;

        const img = card.querySelector("img");

        if(img && img.dataset.src){

            const preload = new Image();

            preload.src = img.dataset.src;

        }

        preloadObserver.unobserve(card);

    });

},{
    rootMargin:"600px"
});


function preloadCards(){

    document
        .querySelectorAll(".card")
        .forEach(card=>preloadObserver.observe(card));

}


/* ---------- FPS Friendly ---------- */

document.querySelectorAll(".card").forEach(card=>{

    card.style.willChange="transform";

});


/* ---------- Ocultar vídeos si la conexión es lenta ---------- */

const connection =
    navigator.connection ||
    navigator.mozConnection ||
    navigator.webkitConnection;

if(connection){

    if(

        connection.saveData ||

        connection.effectiveType==="2g"

    ){

        document.documentElement.classList.add("low-bandwidth");

    }

}


/* ---------- Mensaje de consola ---------- */

console.log("Visual Engine Ready");

/* ==========================================================
   RETRO CATALOG V3
   PARTE 10
   FINAL
========================================================== */

/* ---------- Precargar imágenes próximas ---------- */

if ("requestIdleCallback" in window) {

    requestIdleCallback(() => {

        document.querySelectorAll("img[data-src]").forEach(img => {

            imageObserver.observe(img);

        });

    });

}

/* ---------- Limpiar memoria ---------- */

window.addEventListener("beforeunload", () => {

    stopPreview();

});

/* ---------- Restaurar scroll ---------- */

if ("scrollRestoration" in history) {

    history.scrollRestoration = "manual";

}

/* ---------- Información ---------- */

console.log(`
==========================================
        RETRO CATALOG V3
==========================================

Sistema : ${SYSTEM}

Título  : ${CONFIG.title}

Core    : ${CONFIG.core}

Juegos  : ${GAMES.length}

Estado  : OK

`);

/* ---------- Inicio ---------- */

loadCatalog();

document.getElementById("btnInicio").onclick = () => {
    window.location.href = "index.html";
};
</script>

</body>

</html>
