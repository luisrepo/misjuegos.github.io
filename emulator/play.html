<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Mi Biblioteca Retro</title>
<style>
html, body { margin:0; width:100%; height:100%; background:#000; overflow:hidden; }
#game { width:100%; height:100%; }
</style>
</head>
<body>

<div id="game"></div>

<script>
const params = new URLSearchParams(window.location.search);

window.EJS_player = "#game";

// Sistema dinámico (snes, segaMD, gba...)
window.EJS_core = params.get("core") || "snes";

// Capturamos la ROM que viene de tu archivo index de la carpeta menus
const rawRomUrl = params.get("rom");

// === SOLUCIÓN DEFINITIVA AL ERROR DE RED ===
// Obligamos a que la ROM pase a través de AllOrigins de forma automática
// Esto camufla la petición y elimina el bloqueo de GitHub Pages
if (rawRomUrl && rawRomUrl.startsWith('http')) {
    window.EJS_gameUrl = "https://allorigins.win" + encodeURIComponent(rawRomUrl);
} else {
    window.EJS_gameUrl = rawRomUrl;
}

// Ruta absoluta fija al directorio data de tu servidor de GitHub Pages
window.EJS_pathtodata = "/misjuegos.github.io/emulator/data/";

// Forzamos al emulador a que cargue el núcleo (core) directamente desde internet
// Así evitamos el error 404 si las carpetas de tus cores locales fallan
window.EJS_corePath = "https://emulatorjs.org";

// Configuración de arranque estable oficial
window.EJS_startOnLoaded = true;
window.EJS_fullscreenOnLoaded = false;
window.EJS_color = "#7c3aed";
window.EJS_language = "es-ES";
window.EJS_volume = 1;
window.EJS_disableDatabases = true;

window.EJS_onGameStart = function() {
    console.log("¡El emulador ha arrancado con éxito usando el proxy!");
};
</script>

<!-- Carga del cargador principal de EmulatorJS -->
<script src="/misjuegos.github.io/emulator/data/loader.js"></script>

</body>
</html>
