<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Mi Biblioteca Retro</title>
<style>
html, body { margin:0; width:100%; height:100%; background:#000; overflow:hidden; }
#game { width:100%; height:100%; }
</style>
</head>
<body>

<div id="game"></div>

<script>
const params = new URLSearchParams(window.location.search);

window.EJS_player = "#game";

// 1. Captura el sistema dinámicamente (snes, segaMD, gba...)
window.EJS_core = params.get("core") || "snes";

// 2. MANTIENE ARCHIVE.ORG: Captura la ROM externa limpia que viene de tu catálogo
window.EJS_gameUrl = params.get("rom");

// 3. CORE DESDE TU CARPETA: Le obliga al emulador a buscar el motor en tu propio servidor
window.EJS_pathtodata = "/misjuegos.github.io/emulator/data/";

// Configuración de arranque estable
window.EJS_startOnLoaded = true;
window.EJS_fullscreenOnLoaded = false;
window.EJS_color = "#7c3aed";
window.EJS_language = "es-ES";
window.EJS_volume = 1;
window.EJS_disableDatabases = true;

window.EJS_onGameStart = function() {
    console.log("¡El juego de Archive ha arrancado usando el núcleo local!");
};
</script>

<!-- Carga del script loader de tu servidor -->
<script src="/misjuegos.github.io/emulator/data/loader.js"></script>

</body>
</html>
