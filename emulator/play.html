<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Mi Biblioteca Retro</title>

<style>
html,
body{
    margin:0;
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
}

#game{
    width:100%;
    height:100%;
}
</style>

</head>

<body>

<div id="game"></div>

<script>
const params = new URLSearchParams(window.location.search);

window.EJS_player = "#game";

// Sistema (snes, segaMD, gba...)
window.EJS_core = params.get("core") || "snes";

// Ruta de la ROM de Internet Archive
window.EJS_gameUrl = params.get("rom");

// Ruta absoluta al directorio data de tu repositorio
window.EJS_pathtodata = "/misjuegos.github.io/emulator/data/";

// Configuración básica de arranque
window.EJS_startOnLoaded = true;
window.EJS_fullscreenOnLoaded = false;
window.EJS_color = "#7c3aed";
window.EJS_language = "es-ES";
window.EJS_volume = 1;
window.EJS_disableDatabases = false;

// Proxy oficial activo para saltar el bloqueo de red
window.EJS_CORSProxy = "https://emulatorjs.org";

// === DETALLE CRUCIAL DE ARRANQUE ===
// Fuerza al motor a encender la pantalla gráfica si el inicio automático falla
window.EJS_onGameStart = function() {
    console.log("¡El núcleo de emulación ha arrancado con éxito!");
};
</script>

<!-- Carga del script con ruta absoluta fija -->
<script src="/misjuegos.github.io/emulator/data/loader.js"></script>
