<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Mi Biblioteca Retro</title>

<style>
html,
body{
    margin:0;
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
}

#game{
    width:100%;
    height:100%;
}
</style>

</head>

<body>

<div id="game"></div>

<script>
const params = new URLSearchParams(window.location.search);

window.EJS_player = "#game";

// Sistema (snes, segaMD, gba, gb, nes...)
window.EJS_core = params.get("core") || "snes";

// Ruta de la ROM
window.EJS_gameUrl = params.get("rom");

// Carpeta data
window.EJS_pathtodata = "./data/";

// Configuración básica
window.EJS_startOnLoaded = true;
window.EJS_fullscreenOnLoaded = false;
window.EJS_color = "#7c3aed";
window.EJS_language = "es-ES";
window.EJS_volume = 1;

// Guardado automático
window.EJS_disableDatabases = false;

// === ESTA ES LA LÍNEA NUEVA QUE DEBES AÑADIR ===
// Va justo aquí, antes de cerrar la etiqueta </script>
window.EJS_CORSProxy = "https://emulatorjs.org";

</script>

</body>
</html>
