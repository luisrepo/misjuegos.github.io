<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Mi Biblioteca Retro</title>

<style>
html,
body{
    margin:0;
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
}

#game{
    width:100%;
    height:100%;
}
</style>

</head>

<body>

<div id="game"></div>

<script>
const params = new URLSearchParams(window.location.search);

window.EJS_player = "#game";

// Sistema dinámico (snes, segaMD, gba...)
window.EJS_core = params.get("core") || "snes";

// Ruta directa de la ROM de Internet Archive
window.EJS_gameUrl = params.get("rom");

// Ruta absoluta al directorio data de tu repositorio de GitHub Pages
window.EJS_pathtodata = "/misjuegos.github.io/emulator/data/";

// Configuración de arranque forzado
window.EJS_startOnLoaded = true;
window.EJS_fullscreenOnLoaded = false;
window.EJS_color = "#7c3aed";
window.EJS_language = "es-ES";
window.EJS_volume = 1;

// === CORRECCIÓN CLAVE PARA EL ERROR DE RED ===
// 1. Forzamos el modo de descarga CORS del propio navegador para evitar intermediarios
window.EJS_cors = true;

// 2. Desactivamos las bases de datos locales para que no se congele al inicializar el núcleo
window.EJS_disableDatabases = true;

// 3. ELIMINAMOS LA LÍNEA DEL PROXY ANTERIOR (cors.emulatorjs.org)
// Borra la línea anterior de 'window.EJS_CORSProxy' para que no use el servidor saturado

window.EJS_onGameStart = function() {
    console.log("¡El núcleo de emulación ha arrancado con éxito!");
};
</script>

<!-- Carga del script con ruta absoluta fija -->
<script src="/misjuegos.github.io/emulator/data/loader.js"></script>
