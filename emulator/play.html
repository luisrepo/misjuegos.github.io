<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>EmulatorJS</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    background:#000;
}
#game{
    width:100%;
    height:100%;
}
</style>

<script>
const params=new URLSearchParams(location.search);

window.EJS_player="#game";
window.EJS_core=params.get("core") || "snes";
window.EJS_gameUrl=params.get("rom");
window.EJS_pathtodata="./data/";
</script>

<script src="./data/loader.js"></script>

</head>

<body>

<div id="game"></div>

</body>
</html>
