<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Mi Biblioteca Retro</title>

<style>
html,
body{
    margin:0;
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
}

#game{
    width:100%;
    height:100%;
}
</style>

</head>

<body>

<div id="game"></div>

<script>
const params = new URLSearchParams(window.location.search);

window.EJS_player = "#game";

// Sistema dinámico (snes, segaMD, gba...)
window.EJS_core = params.get("core") || "snes";

// Capturamos la ROM que viene de Internet Archive
const rawRomUrl = params.get("rom");

// === SOLUCIÓN TOTAL AL ERROR DE RED ===
// Pasamos la URL a través de AllOrigins para saltar los bloqueos de GitHub y Archive de golpe
if (rawRomUrl && rawRomUrl.startsWith('http')) {
    window.EJS_gameUrl = "https://allorigins.win" + encodeURIComponent(rawRomUrl);
} else {
    window.EJS_gameUrl = rawRomUrl;
}

// Ruta absoluta al directorio data de tu repositorio
window.EJS_pathtodata = "/misjuegos.github.io/emulator/data/";

// Configuración de arranque estable
window.EJS_startOnLoaded = true;
window.EJS_fullscreenOnLoaded = false;
window.EJS_color = "#7c3aed";
window.EJS_language = "es-ES";
window.EJS_volume = 1;

// Desactivamos bases de datos locales para evitar congelamientos en el inicio
window.EJS_disableDatabases = true;

window.EJS_onGameStart = function() {
    console.log("¡El núcleo de emulación ha arrancado con éxito!");
};
</script>

<!-- Carga del script con ruta absoluta fija -->
<script src="/misjuegos.github.io/emulator/data/loader.js"></script>
