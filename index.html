<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>My Arcade Spain</title>

<style>

body{
    margin:0;
    font-family:Inter,Arial,sans-serif;
    background:#0b0b0f;
    color:white;
}

header{
    text-align:center;
    padding:40px 20px;
}

h1{
    margin:0;
    font-size:3rem;
}

p{
    color:#aaa;
}

#systems{

    width:min(1400px,95%);
    margin:50px auto;

    display:grid;

    grid-template-columns:repeat(auto-fit,minmax(320px,1fr));

    gap:35px;

}

.card{

    width:340px;
    height:430px;

    position:relative;

    overflow:hidden;

    border-radius:26px;

    background:#1b1b22;

    background-size:cover;

    background-position:center;

    display:flex;

    flex-direction:column;

    justify-content:flex-end;

    align-items:center;

    transition:.35s;

    cursor:pointer;

    border:1px solid rgba(255,255,255,.08);

}

.card::before{

    content:"";

    position:absolute;

    inset:0;

    background:linear-gradient(
        to top,
        rgba(0,0,0,.92) 0%,
        rgba(0,0,0,.55) 45%,
        rgba(0,0,0,.15) 100%
    );

}

.card:hover{

    transform:
        translateY(-10px)
        scale(1.03);

    box-shadow:
        0 30px 60px rgba(0,0,0,.60);

}

.card>*{

    position:relative;

    z-index:2;

}

.logo{

    width:220px;

    height:110px;

    object-fit:contain;

    margin-bottom:35px;

}

.card h2{

    margin:0;

    font-size:32px;

    text-align:center;

}

.fabricante{

    margin-top:10px;

    color:#d8d8d8;

    font-size:20px;

}

.info{

    margin-top:10px;

    color:#b8b8b8;

    font-size:16px;

}

.games{

    margin:22px 0 35px;

    font-size:20px;

    font-weight:700;

}

</style>

</head>

<body>

<header>

<h1>MY ARCADE SPAIN</h1>

<p>Selecciona una consola</p>

</header>

<div id="systems"></div>

<script>

async function cargarConsolas(){

    const respuesta = await fetch("systems.json");
    const sistemas = await respuesta.json();

    const contenedor = document.getElementById("systems");

    for (const sistema of sistemas) {

    let totalJuegos = 0;
    let config = {};

    try {

        const cfg = await fetch(`media/${sistema.system}/config.json`);
        config = await cfg.json();

        totalJuegos = config.games ? config.games.length : 0;

    } catch(e) {
        console.error(e);
    }

        const tarjeta = document.createElement("div");
        tarjeta.className = "card";
		tarjeta.style.backgroundImage =
        `linear-gradient(rgba(0,0,0,.15),rgba(0,0,0,.75)),
        url(media/${sistema.system}/background.jpg)`;

tarjeta.style.backgroundSize = "cover";
tarjeta.style.backgroundPosition = "center";

        tarjeta.innerHTML = `
    <img class="logo"
     src="media/${sistema.system}/logos/logo.png"
     onerror="this.style.display='none'">

<h2>${sistema.title}</h2>

<div class="fabricante">${sistema.manufacturer}</div>

<div class="info">
    ${sistema.generation} · ${sistema.year}
</div>

    <div class="games">
        🎮 ${totalJuegos} juegos
    </div>
`;


        tarjeta.onclick = () => {
            location.href = `catalogo.html?system=${sistema.system}`;
        };

        contenedor.appendChild(tarjeta);

    }

}

cargarConsolas();

</script>

</body>
</html>
