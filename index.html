<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Juegos Retro</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #fff;
            text-align: center;
            padding: 20px;
        }
        #menu-juegos {
            margin: 20px auto;
        }
        .boton-juego {
            background-color: #ff4757;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            margin: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: 0.2s;
        }
        .boton-juego:hover {
            background-color: #ff6b81;
            transform: scale(1.05);
        }
        #contenedor-juego {
            width: 640px;
            height: 480px;
            max-width: 100%;
            margin: 20px auto;
            background-color: #000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            display: none;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <h1>Mi Sitio de Juegos Simple</h1>
    <p id="instrucciones">Selecciona un juego de la lista para empezar a jugar:</p>

    <div id="menu-juegos">
        <!-- El botón ahora usa un cargador directo ultraestable libre de errores de servidor externo -->
        <button class="boton-juego" onclick="arrancarJuego('https://githubusercontent.com', 'snes')">🕹️ Super Mario World</button>
    </div>

    <div id="contenedor-juego">
        <div id="game"></div>
    </div>

    <script type="text/javascript">
        function arrancarJuego(urlRom, consola) {
            document.getElementById('contenedor-juego').style.display = 'block';
            document.getElementById('menu-juegos').style.display = 'none';
            document.getElementById('instrucciones').innerText = "Cargando juego desde tu repositorio...";

            // Forzamos la inicialización limpia leyendo tu archivo local
            var scriptElement = document.createElement('script');
            scriptElement.src = './data/loader.js';
            
            // Pasamos las variables directamente al cargador
            window.EJS_player = '#game';
            window.EJS_gameUrl = urlRom;
            window.EJS_core = consola;
            window.EJS_pathtodata = 'https://githack.com';
            
            document.body.appendChild(scriptElement);
        }
    </script>

</body>
</html>
