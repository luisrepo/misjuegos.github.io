<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Mario World - Retro</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #fff;
            text-align: center;
            padding: 20px;
        }
        #contenedor-juego {
            width: 640px;
            height: 480px;
            max-width: 100%;
            margin: 20px auto;
            background-color: #000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <h1>Super Mario World</h1>
    <p>Haz clic en la pantalla si no escuchas el sonido. Controles: Flechas y teclas Z, X, C, V, Enter, Shift.</p>

    <div id="contenedor-juego">
        <div id="game"></div>
    </div>

    <!-- Cargamos el motor de emulación directo desde una CDN libre de bloqueos de marcos -->
    <script type="text/javascript">
        EJS_player = '#game';
        EJS_biosUrl = ''; 
        EJS_gameUrl = 'Mario.sfc'; // Tu archivo verificado
        EJS_core = 'snes'; 
        // Usamos servidores alternativos de datos para evitar bloqueos regionales o de caché
        EJS_pathtodata = 'https://githack.com';
    </script>
    
    <script src="https://githack.comloader.js"></script>

</body>
</html>
