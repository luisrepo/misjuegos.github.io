<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Mi Biblioteca Retro</title>

<meta name="description"
content="Mi colección de videojuegos retro">


<style>

/* ========================================
   GENERAL
======================================== */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    color: white;

    min-height: 100vh;

    background:

        radial-gradient(
            circle at 50% -20%,
            #1e3a8a 0%,
            #0b1120 35%,
            #05070d 75%
        );

}


/* ========================================
   HEADER
======================================== */

header {

    position: sticky;

    top: 0;

    z-index: 100;

    padding: 18px 5%;

    background:
        rgba(5, 8, 18, .92);

    backdrop-filter:
        blur(15px);

    border-bottom:
        1px solid #1e293b;
}


.header {

    max-width: 1400px;

    margin: auto;

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 25px;
}


.logo {

    font-size: 25px;

    font-weight: 800;

    white-space: nowrap;
}


.logo span {

    color: #22d3ee;
}


/* ========================================
   BUSCADOR
======================================== */

.search {

    width: 100%;

    max-width: 430px;
}


.search input {

    width: 100%;

    padding: 13px 18px;

    border-radius: 12px;

    border:
        1px solid #334155;

    background:
        #111827;

    color: white;

    font-size: 15px;

    outline: none;
}


.search input:focus {

    border-color:
        #22d3ee;

    box-shadow:
        0 0 0 3px
        rgba(34,211,238,.1);
}


/* ========================================
   HERO
======================================== */

.hero {

    max-width: 1400px;

    margin: auto;

    padding:
        75px 5% 55px;
}


.hero h1 {

    font-size:
        clamp(
            42px,
            7vw,
            75px
        );

    line-height: 1;

    margin-bottom: 22px;
}


.hero h1 span {

    color: #22d3ee;
}


.hero p {

    max-width: 650px;

    color: #94a3b8;

    font-size: 18px;

    line-height: 1.6;
}


/* ========================================
   CONSOLAS
======================================== */

.consoles {

    max-width: 1400px;

    margin: auto;

    padding:
        0 5% 80px;
}


.consoles-header {

    display: flex;

    justify-content:
        space-between;

    align-items: center;

    margin-bottom: 25px;
}


.consoles-header h2 {

    font-size: 28px;
}


.console-grid {

    display: grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(230px, 1fr)
        );

    gap: 22px;
}


/* ========================================
   TARJETAS DE CONSOLA
======================================== */

.console-card {

    position: relative;

    min-height: 180px;

    padding: 25px;

    display: flex;

    flex-direction: column;

    justify-content: flex-end;

    overflow: hidden;

    cursor: pointer;

    border-radius: 18px;

    border:
        1px solid #293548;

    background:
        linear-gradient(
            145deg,
            #172033,
            #0b101b
        );

    transition:
        transform .25s,
        border-color .25s,
        box-shadow .25s;
}


.console-card:hover {

    transform:
        translateY(-8px);

    border-color:
        #22d3ee;

    box-shadow:
        0 20px 50px
        rgba(0,0,0,.45);
}


/* brillo */

.console-card::before {

    content: "";

    position: absolute;

    width: 180px;

    height: 180px;

    right: -60px;

    top: -70px;

    border-radius: 50%;

    background:
        rgba(34,211,238,.12);

    filter:
        blur(10px);
}


.console-icon {

    position: absolute;

    top: 22px;

    right: 25px;

    font-size: 55px;

    opacity: .9;

    transition:
        transform .3s;
}


.console-card:hover
.console-icon {

    transform:
        scale(1.15)
        rotate(5deg);
}


.console-card h3 {

    position: relative;

    z-index: 2;

    font-size: 25px;

    margin-bottom: 7px;
}


.console-card p {

    position: relative;

    z-index: 2;

    color: #94a3b8;

    font-size: 14px;
}


/* ========================================
   COLORES
======================================== */

.snes:hover {

    border-color:
        #a855f7;
}

.gamegear:hover {

    border-color:
        #a855f7;
}

.nes:hover {

    border-color:
        #ef4444;
}

.gb:hover {

    border-color:
        #22c55e;
}

.gba:hover {

    border-color:
        #6366f1;
}

.megadrive:hover {

    border-color:
        #f59e0b;
}


/* ========================================
   FOOTER
======================================== */

footer {

    border-top:
        1px solid #1e293b;

    text-align: center;

    padding: 35px;

    color: #475569;

    font-size: 14px;
}


/* ========================================
   MÓVIL
======================================== */

@media(max-width:700px) {

    .header {

        flex-direction:
            column;
    }


    .logo {

        text-align: center;
    }


    .hero {

        padding-top:
            45px;
    }


    .console-grid {

        grid-template-columns:
            repeat(2, 1fr);

        gap: 12px;
    }


    .console-card {

        min-height: 150px;

        padding: 17px;
    }


    .console-card h3 {

        font-size: 19px;
    }


    .console-icon {

        font-size: 40px;

        top: 15px;

        right: 15px;
    }

}

</style>

</head>


<body>


<!-- ========================================
     HEADER
======================================== -->

<header>

<div class="header">

    <div class="logo">

        🎮 <span>MI</span> BIBLIOTECA

    </div>


    <div class="search">

        <input
            id="search"
            type="text"
            placeholder="🔎 Buscar consola..."
            oninput="searchConsoles()"
        >

    </div>

</div>

</header>



<!-- ========================================
     HERO
======================================== -->

<section class="hero">

<h1>

    Tu colección
    <span>retro</span>

</h1>


<p>

    Elige una consola y descubre
    todos los juegos de tu colección.

</p>

</section>



<!-- ========================================
     CONSOLAS
======================================== -->

<section class="consoles">

<div class="consoles-header">

    <h2>🎮 Consolas</h2>

</div>


<div
    id="consoleGrid"
    class="console-grid">
</div>

</section>



<footer>

    🎮 Mi Biblioteca Retro

</footer>



<script>


/* ========================================
   CONSOLAS
========================================

   Para añadir una nueva consola copia
   uno de estos bloques.

======================================== */


const consoles = [

    {
        nombre: "Super Nintendo",
        carpeta: "snes",
        icono: "🎮",
        descripcion: "Juegos de SNES",
        clase: "snes"
    },


    {
        nombre: "Mega Drive",
        carpeta: "megadrive",
        icono: "🎮",
        descripcion: "Juegos de Mega Drive",
        clase: "megadrive"
    },

   
    {
        nombre: "Game Boy Advance",
        carpeta: "gba",
        icono: "🎮",
        descripcion: "Juegos de Game Boy Advance",
        clase: "gba"
    }

];



/* ========================================
   MOSTRAR CONSOLAS
======================================== */

function showConsoles(list) {

    const grid =
        document.getElementById(
            "consoleGrid"
        );


    grid.innerHTML = "";


    if (list.length === 0) {

        grid.innerHTML = `

            <p style="
                color:#64748b;
                grid-column:1/-1;
                padding:50px;
                text-align:center;
            ">

                😔 No se encontró esa consola.

            </p>

        `;

        return;
    }


    list.forEach(console => {

        const card =
            document.createElement(
                "div"
            );


        card.className =
            "console-card " +
            console.clase;


        card.innerHTML = `

            <div class="console-icon">

                ${console.icono}

            </div>


            <h3>

                ${console.nombre}

            </h3>


            <p>

                ${console.descripcion}

            </p>

        `;


        card.onclick = () => {

            window.location.href =
                console.carpeta + "/";

        };


        grid.appendChild(card);

    });

}



/* ========================================
   BUSCADOR
======================================== */

function searchConsoles() {

    const text =
        document
            .getElementById("search")
            .value
            .toLowerCase()
            .trim();


    const filtered =
        consoles.filter(console =>

            console.nombre
                .toLowerCase()
                .includes(text)

        );


    showConsoles(filtered);

}



/* ========================================
   INICIAR
======================================== */

showConsoles(consoles);


</script>


</body>

</html>
