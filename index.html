<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Super Mario World</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #090909;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        header {
            padding: 20px;
            background: #111;
            border-bottom: 1px solid #333;
        }

        h1 {
            margin: 0;
            font-size: 28px;
        }

        .game {
            width: 95%;
            max-width: 1100px;
            height: 75vh;
            margin: 25px auto;
            background: #000;
            border: 2px solid #333;
            border-radius: 10px;
            overflow: hidden;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }

        .info {
            color: #aaa;
            margin: 15px;
        }

        .fullscreen {
            background: #e60012;
            color: white;
            border: 0;
            border-radius: 8px;
            padding: 12px 20px;
            cursor: pointer;
            font-size: 16px;
        }

        .fullscreen:hover {
            background: #ff2030;
        }

        @media (max-width: 600px) {
            .game {
                width: 100%;
                height: 70vh;
                margin: 10px auto;
                border-radius: 0;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>🎮 Super Mario World</h1>
</header>

<div class="game">
    <iframe
        id="emulator"
        src="https://binbashbanana.github.io/webretro/?core=snes9x&rom=https://luisrepo.github.io/misjuegos.github.io/roms/Mario.sfc"
        allow="autoplay; fullscreen"
        allowfullscreen>
    </iframe>
</div>

<p class="info">
    Usa el teclado para jugar.
</p>

<button class="fullscreen" onclick="fullscreen()">
    ⛶ Pantalla completa
</button>

<script>
function fullscreen() {
    const game = document.getElementById("emulator");

    if (game.requestFullscreen) {
        game.requestFullscreen();
    } else if (game.webkitRequestFullscreen) {
        game.webkitRequestFullscreen();
    }
}
</script>

</body>
</html>
