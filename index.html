<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Biblioteca Retro — Menú Principal</title>
    <style>
        /* Estética Github Dark */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-size: 28px;
            color: #f0f6fc;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #8b949e;
            font-size: 16px;
            margin-bottom: 40px;
        }

        /* Contenedor del Menú */
        .menu-container {
            display: flex;
            justify-content: center;
            gap: 24px;
            flex-wrap: wrap;
            max-width: 1000px;
            width: 100%;
        }

        /* Tarjeta de Consola Interactiva */
        .console-card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 30px;
            width: 220px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Efectos dinámicos en Hover */
        .console-card:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        /* Colores personalizados por consola al pasar el ratón */
        .console-card.snes:hover { border-color: #7c3aed; }
        .console-card.megadrive:hover { border-color: #007eed; }
        .console-card.mastersystem:hover { border-color: #ef4444; }
        .console-card.gba:hover { border-color: #10b981; }

        .console-logo {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .console-card h3 {
            margin: 10px 0 4px 0;
            font-size: 18px;
            color: #f0f6fc;
        }

        .console-card p {
            margin: 0;
            font-size: 13px;
            color: #8b949e;
        }
    </style>
</head>
<body>

    <h1>Mi Biblioteca Retro</h1>
    <p class="subtitle">Selecciona una plataforma o busca un juego globalmente</p>
    
    <div class="menu-container">
        
        <!-- Tarjeta Super Nintendo -->
        <div class="console-card snes" onclick="location.href='catalogo.html?console=snes'">
            <div class="console-logo">📺</div>
            <h3>Super Nintendo</h3>
            <p>16 Bits — Nintendo</p>
        </div>

        <!-- Tarjeta Sega Mega Drive -->
        <div class="console-card megadrive" onclick="location.href='catalogo.html?console=megadrive'">
            <div class="console-logo">🎮</div>
            <h3>Sega Mega Drive</h3>
            <p>16 Bits — SEGA</p>
        </div>

        <!-- Tarjeta Sega Master System -->
        <div class="console-card mastersystem" onclick="location.href='catalogo.html?console=mastersystem'">
            <div class="console-logo">🎮</div>
            <h3>Sega Master System</h3>
            <p>8 Bits — SEGA</p>
        </div>

        <!-- Tarjeta Game Boy Advance -->
        <div class="console-card gba" onclick="location.href='catalogo.html?console=gba'">
            <div class="console-logo">🕹</div>
            <h3>Game Boy Advance</h3>
            <p>32 Bits — Portátil</p>
        </div>

    </div>

</body>
</html>
