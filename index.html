<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Mario World - Retro</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #fff;
            text-align: center;
            padding: 20px;
        }
        #contenedor-juego {
            width: 640px;
            height: 480px;
            max-width: 100%;
            margin: 20px auto;
            background-color: #000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        #nostalgia-player {
            width: 100%;
            height: 100%;
        }
    </style>
    <!-- Cargamos la librería del emulador directamente de forma segura -->
    <script src="https://unpkg.com"></script>
</head>
<body>

    <h1>Super Mario World</h1>
    <p>Las teclas por defecto son las flechas para moverte y Z, X, C, V para los botones.</p>

    <div id="contenedor-juego">
        <div id="nostalgia-player"></div>
    </div>

    <script>
        // Arrancamos el emulador apuntando a tu juego propio de GitHub
        const player = new Nostalgia({
            element: '#nostalgia-player',
            core: 'snes',
            romUrl: 'https://github.io'
        });
    </script>

</body>
</html>
