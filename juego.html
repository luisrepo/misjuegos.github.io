<html lang="es">
<head>

    <style>

        #contenedor-juego {
            width: 640px;

            width: 100%;
            height: 100%;

    <h1>Super Mario World</h1>
    <p>Cargando emulador limpio...</p>

    <div id="contenedor-juego">
        <div id="game"></div>
    </div>

    <script type="text/javascript">
        EJS_player = '#game';
        EJS_biosUrl = ''; 
        EJS_gameUrl = 'Mario.sfc'; 
        EJS_core = 'snes'; 
        EJS_pathtodata = 'https://jsdelivr.net';

    <script src="https://jsdelivr.netloader.js"></script>

</html>
