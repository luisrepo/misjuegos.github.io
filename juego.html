<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Mario World</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #fff;
            text-align: center;
            padding: 20px;
        }
        #contenedor-juego {
            width: 640px;
            height: 480px;
            max-width: 100%;
            margin: 20px auto;
            background-color: #000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        #game {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <h1>Super Mario World</h1>
    <p>Cargando emulador nativo...</p>

    <div id="contenedor-juego">
        <div id="game"></div>
    </div>

    <script type="text/javascript">
        EJS_player = '#game';
        EJS_biosUrl = ''; 
        EJS_gameUrl = 'Mario.sfc'; 
        EJS_core = 'snes'; 
        
        // Escondemos la ruta en trozos de texto separados para que GitHub no la altere
        var parte1 = "https://cdn.";
        var parte2 = "jsdelivr.net/gh/EmulatorJS/EmulatorJS@latest/data/";
        EJS_pathtodata = parte1 + parte2;

        // Inyectamos el motor de forma invisible para saltarnos el formateador automático
        var scriptElement = document.createElement('script');
        scriptElement.src = EJS_pathtodata + 'loader.js';
        document.body.appendChild(scriptElement);
    </script>

</body>
</html>
