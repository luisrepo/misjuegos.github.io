<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Master System — Mi Biblioteca Retro</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      /* Fondo azul oscuro con rejilla retro sutil inspirada en SEGA */
      background: radial-gradient(circle at top, #10255c 0%, #060e26 50%, #02040b 100%);
      color: white;
      min-height: 100vh;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 18px 5%;
      background: rgba(2, 4, 11, 0.94);
      backdrop-filter: blur(15px);
      border-bottom: 1px solid #ff3b30; /* Línea roja corporativa de Master System */
    }
    .header-container {
      max-width: 1400px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 25px;
    }
    .logo { font-size: 24px; font-weight: 800; font-style: italic; }
    .logo span { color: #ff3b30; }
    .back-button {
      display: inline-flex;
      align-items: center;
      padding: 10px 15px;
      border-radius: 9px;
      background: #09132b;
      border: 1px solid #1a2e5c;
      color: #cbd5e1;
      text-decoration: none;
      transition: .2s;
    }
    .back-button:hover { color: white; border-color: #ff3b30; background: #13234d; }
    .search input {
      width: 100%;
      max-width: 400px;
      padding: 12px 18px;
      border-radius: 12px;
      border: 1px solid #1a2e5c;
      background: #060c1c;
      color: white;
      outline: none;
    }
    .search input:focus { border-color: #ff3b30; }
    .hero { max-width: 1400px; margin: auto; padding: 40px 5% 20px; }
    .hero h1 { font-size: 2.5rem; font-weight: 900; font-style: italic; margin-bottom: 8px; }
    .hero h1 span { color: #ff3b30; }
    .hero p { color: #a1a1aa; }
    .games-section { max-width: 1400px; margin: auto; padding: 20px 5% 70px; }
    
    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 22px;
    }
    .game-card {
      background: #060d21;
      border: 1px solid #14244d;
      border-radius: 15px;
      overflow: hidden;
      cursor: pointer;
      transition: transform .25s, border-color .25s;
    }
    .game-card:hover {
      transform: translateY(-7px);
      border-color: #ff3b30;
      box-shadow: 0 15px 40px rgba(0,0,0,.6);
    }
    
    /* FORMATO CUADRADO PERFECTO 1:1 PARA CAJAS SMS */
    .cover {
      position: relative;
      aspect-ratio: 1 / 1; 
      background: #040814;
      overflow: hidden;
    }
    .cover img, .cover video {
      width: 100%;
      height: 100%;
      object-fit: cover; 
      position: absolute;
      top: 0;
      left: 0;
      transition: opacity 0.3s ease;
    }
    .cover video {
      opacity: 0;
      pointer-events: none;
    }
    .game-card:hover .cover img {
      opacity: 0;
    }
    .game-card:hover .cover video {
      opacity: 1;
    }
    
    .play-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,.5);
      opacity: 0;
      transition: .25s;
      z-index: 2;
    }
    .game-card:hover .play-overlay { opacity: 1; }
    .play-button {
      width: 55px;
      height: 55px;
      border-radius: 50%;
      background: #ff3b30;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: bold;
    }
    .game-info { padding: 14px; }
    .game-info h3 { font-size: 16px; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .game-info p { color: #71717a; font-size: 13px; }
    
    /* Ventana del Emulador */
    .player {
      position: fixed;
      inset: 0;
      z-index: 999;
      display: none;
      padding: 15px;
      background: rgba(0,0,0,.95);
    }
    .player.active { display: block; }
    .player-container {
      width: 100%;
      height: 100%;
      max-width: 1400px;
      margin: auto;
      display: flex;
      flex-direction: column;
    }
    .player-header {
      min-height: 50px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      padding-bottom: 10px;
    }
    .player-title { font-size: 18px; font-weight: bold; }
    .btn-close {
      background: #ef4444;
      border: 0;
      padding: 8px 15px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      color: white;
    }
    .btn-close:hover { background: #dc2626; }
    .emulator-iframe {
      flex: 1;
      width: 100%;
      border: 1px solid #292929;
      border-radius: 10px;
      background: black;
    }
  </style>
</head>

  function renderGames() {
    const grid = document.getElementById("gamesGrid");
    const search = document.getElementById("search").value.toLowerCase().trim();
    const filtered = games.filter(g => g.nombre.toLowerCase().includes(search));

    grid.innerHTML = "";

    if (filtered.length === 0) {
      grid.innerHTML = `<p style="grid-column:1/-1; text-align:center; color:#71717a;">No se encontraron juegos.</p>`;
      return;
    }

    filtered.forEach(game => {
      const card = document.createElement("div");
      card.className = "game-card";
      card.innerHTML = `
        <div class="cover">
          <img src="${game.portada}" alt="${game.nombre}" loading="lazy" onerror="this.src='https://placeholder.com'">
          
          ${game.video ? `<video src="${game.video}" loop muted playsinline></video>` : ''}

          <div class="play-overlay">
            <div class="play-button">▶</div>
          </div>
        </div>
        <div class="game-info">
          <h3>${game.nombre}</h3>
          <p>Sega Master System</p>
        </div>
      `;

      if (game.video) {
        card.onmouseenter = () => {
          const video = card.querySelector('video');
          if (video) video.play().catch(() => {});
        };
        card.onmouseleave = () => {
          const video = card.querySelector('video');
          if (video) {
            video.pause();
            video.currentTime = 0;
          }
        };
      }

      card.onclick = () => openGame(game);
      grid.appendChild(card);
    });
  }

  function openGame(game) {
    const player = document.getElementById("player");
    const emulator = document.getElementById("emulator");
    const title = document.getElementById("playerTitle");

    title.textContent = "🎮 " + game.nombre;
    
    // CORRECCIÓN DE RUTA AL REPRODUCTOR CENTRAL DESDE LA CARPETA 'menus/'
    // Viaja hacia atrás (../) para entrar en emulator/play.html e inyecta el core 'sms'
    emulator.src = `../emulator/play.html?core=sms&rom=${encodeURIComponent(game.rom)}&name=${encodeURIComponent(game.nombre)}`;

    player.classList.add("active");
    document.body.style.overflow = "hidden";
  }

  function closeGame() {
    const player = document.getElementById("player");
    const emulator = document.getElementById("emulator");
    
    player.classList.remove("active");
    document.body.style.overflow = "";
    emulator.src = "";
  }

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") closeGame();
  });

  // Habilitamos el auto-filtrado si el usuario viene del buscador inteligente del menú de inicio
  const urlParamsConsole = new URLSearchParams(window.location.search);
  const juegoBuscado = urlParamsConsole.get('search');
  if (juegoBuscado) {
    document.getElementById("search").value = juegoBuscado;
  }

  renderGames();
</script>
