<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Megadrive — Mi Biblioteca Retro</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at top, #35146b 0%, #0d0a18 40%, #05070b 100%);
      color: white;
      min-height: 100vh;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 18px 5%;
      background: rgba(5,7,15,.94);
      backdrop-filter: blur(15px);
      border-bottom: 1px solid #29213d;
    }
    .header-container {
      max-width: 1400px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 25px;
    }
    .logo { font-size: 24px; font-weight: 800; }
    .logo span { color: #c084fc; }
    .back-button {
      display: inline-flex;
      align-items: center;
      padding: 10px 15px;
      border-radius: 9px;
      background: #171124;
      border: 1px solid #392b50;
      color: #cbd5e1;
      text-decoration: none;
      transition: .2s;
    }
    .back-button:hover { color: white; border-color: #c084fc; background: #211735; }
    .search input {
      width: 100%;
      max-width: 400px;
      padding: 12px 18px;
      border-radius: 12px;
      border: 1px solid #392b50;
      background: #130f20;
      color: white;
      outline: none;
    }
    .search input:focus { border-color: #c084fc; }
    .hero { max-width: 1400px; margin: auto; padding: 40px 5% 20px; }
    .hero h1 { font-size: 2.5rem; margin-bottom: 8px; }
    .hero h1 span { color: #c084fc; }
    .hero p { color: #a1a1aa; }
    .games-section { max-width: 1400px; margin: auto; padding: 20px 5% 70px; }
    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 22px;
    }
    .game-card {
      background: #120e1d;
      border: 1px solid #2d2440;
      border-radius: 15px;
      overflow: hidden;
      cursor: pointer;
      transition: transform .25s, border-color .25s;
    }
    .game-card:hover {
      transform: translateY(-7px);
      border-color: #c084fc;
      box-shadow: 0 15px 40px rgba(0,0,0,.45);
    }
    .cover {
      position: relative;
      /* CAMBIO AQUÍ: Cambiamos de 4/3 a 3/4 para que la caja sea vertical */
      aspect-ratio: 3 / 4; 
      background: #1e172b;
      overflow: hidden;
    }
    .cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform .35s;
    }
    .game-card:hover .cover img { transform: scale(1.06); }
    .play-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,.5);
      opacity: 0;
      transition: .25s;
    }
    .game-card:hover .play-overlay { opacity: 1; }
    .play-button {
      width: 55px;
      height: 55px;
      border-radius: 50%;
      background: #c084fc;
      color: #180b27;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: bold;
    }
    .game-info { padding: 14px; }
    .game-info h3 { font-size: 16px; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .game-info p { color: #71717a; font-size: 13px; }
    
    /* Ventana del Emulador */
    .player {
      position: fixed;
      inset: 0;
      z-index: 999;
      display: none;
      padding: 15px;
      background: rgba(0,0,0,.95);
    }
    .player.active { display: block; }
    .player-container {
      width: 100%;
      height: 100%;
      max-width: 1400px;
      margin: auto;
      display: flex;
      flex-direction: column;
    }
    .player-header {
      min-height: 50px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      padding-bottom: 10px;
    }
    .player-title { font-size: 18px; font-weight: bold; }
    .btn-close {
      background: #ef4444;
      border: 0;
      padding: 8px 15px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      color: white;
    }
    .btn-close:hover { background: #dc2626; }
    .emulator-iframe {
      flex: 1;
      width: 100%;
      border: 1px solid #292929;
      border-radius: 10px;
      background: black;
    }
  </style>
</head>

  function renderGames() {
    const grid = document.getElementById("gamesGrid");
    const search = document.getElementById("search").value.toLowerCase().trim();
    const filtered = games.filter(g => g.nombre.toLowerCase().includes(search));

    grid.innerHTML = "";

    if (filtered.length === 0) {
      grid.innerHTML = `<p style="grid-column:1/-1; text-align:center; color:#71717a;">No se encontraron juegos.</p>`;
      return;
    }

    filtered.forEach(game => {
      const card = document.createElement("div");
      card.className = "game-card";
      card.innerHTML = `
        <div class="cover">
          <img src="${game.portada}" alt="${game.nombre}" loading="lazy" onerror="this.src='https://via.placeholder.com/300x225?text=Sin+Portada'">
          <div class="play-overlay">
            <div class="play-button">▶</div>
          </div>
        </div>
        <div class="game-info">
          <h3>${game.nombre}</h3>
          <p>Super Nintendo</p>
        </div>
      `;
      card.onclick = () => openGame(game);
      grid.appendChild(card);
    });
  }

  function openGame(game){

    const emulator=document.getElementById("emulator");

    emulator.src=
        "../emulator/play.html?core=segaMD&rom="
        +encodeURIComponent(game.rom);

    document.getElementById("player").classList.add("active");
}

  function closeGame() {
    const player = document.getElementById("player");
    const emulator = document.getElementById("emulator");
    
    player.classList.remove("active");
    document.body.style.overflow = "";
    emulator.src = "";
  }

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") closeGame();
  });

  renderGames();
</script>
