<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cargando Super Mario...</title>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            // 1. Definimos la ruta del emulador que sí funciona (subiendo un nivel con ../)
            const rutaEmulador = "../emulator/index.html"; 
            
            // 2. Definimos la ruta de la ROM del juego relativa a ese emulador
            // Como el emulador está en "emulator/", para llegar a la ROM debe hacer: ../roms/snes/
            const rutaRom = "../roms/snes/mario.sfc"; 
            
            // 3. Redirigimos automáticamente pasando el juego en la URL
            window.location.href = `${rutaEmulador}?rom=${encodeURIComponent(rutaRom)}`;
        });
    </script>
</head>
<body>
    <p style="text-align: center; font-family: sans-serif; margin-top: 50px;">
        Conectando con el emulador y cargando el juego...
    </p>
</body>
</html>
